<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Tesla Escolar" />
    <title>Tesla Control Escolar</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <style>
      /* Pantalla de carga: se ve apenas llega el HTML, antes de que cargue el JavaScript de la app. */
      html, body { margin: 0; background: #020617; }
      #boot-splash { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 18px; background: #020617; color: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #boot-splash img { width: 96px; height: 96px; border-radius: 24px; }
      #boot-splash p { margin: 0; font-size: 13px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: #94a3b8; }
      #boot-splash i { display: block; width: 120px; height: 3px; border-radius: 3px; background: #1e293b; overflow: hidden; position: relative; }
      #boot-splash i::after { content: ''; position: absolute; inset: 0; width: 45%; border-radius: 3px; background: #f0b429; animation: boot-bar 1.1s ease-in-out infinite; }
      @keyframes boot-bar { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #boot-splash i::after { animation: none; width: 100%; opacity: .5; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" role="status" aria-label="Cargando Tesla Control Escolar">
        <img src="/icons/icon-192.png" alt="" width="96" height="96" />
        <p>Tesla Control Escolar</p>
        <i></i>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
